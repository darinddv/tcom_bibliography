<div id="predictors-section">
    {% if predictors %}
    <div class="mb-3">
        {% for predictor in predictors %}
        <div class="d-flex justify-content-between align-items-center py-2
                    {% if not forloop.last %}border-bottom{% endif %}">
            <div>
                <span class="badge bg-secondary me-2">
                    {{ predictor.category.label|default:"Uncategorized" }}
                </span>
                <span class="small">{{ predictor.description|truncatechars:80 }}</span>
            </div>
            <button class="btn btn-sm btn-link text-danger p-0"
                    hx-post="{% url 'contributor:delete_predictor' publication.pk predictor.pk %}"
                    hx-target="#predictors-section"
                    hx-swap="outerHTML"
                    hx-vals='{"extraction_id": "{{ extraction_id }}"}'>
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <form hx-post="{% url 'contributor:add_predictor' publication.pk %}"
          hx-target="#predictors-section"
          hx-swap="outerHTML">
        {% csrf_token %}
        <input type="hidden" name="extraction_id" value="{{ extraction_id }}">
        <div class="row g-2 align-items-end">
            <div class="col-md-4">
                <label class="form-label small">Category</label>
                {{ predictor_form.category }}
            </div>
            <div class="col-md-6">
                <label class="form-label small">Description</label>
                {{ predictor_form.description }}
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-outline-primary w-100">
                    <i class="bi bi-plus"></i>
                </button>
            </div>
        </div>
    </form>
</div>
