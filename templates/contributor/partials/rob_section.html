<div id="rob-section">

    {% if rob_domains %}
    <div class="mb-3">
        {% for domain in rob_domains %}
        <div class="d-flex justify-content-between align-items-center py-2
                    {% if not forloop.last %}border-bottom{% endif %}">
            <div>
                <span class="fw-medium small">{{ domain.domain_name }}</span>
                <span class="badge bg-secondary ms-2 small">{{ domain.get_rating_display }}</span>
                {% if domain.notes %}
                    <span class="text-muted small ms-2">{{ domain.notes }}</span>
                {% endif %}
            </div>
            <button class="btn btn-sm btn-link text-danger p-0"
                    hx-post="{% url 'contributor:delete_rob_domain' publication.pk domain.pk %}"
                    hx-target="#rob-section"
                    hx-swap="outerHTML"
                    hx-vals='{"extraction_id": "{{ extraction_id }}"}'>
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <form hx-post="{% url 'contributor:add_rob_domain' publication.pk %}"
          hx-target="#rob-section"
          hx-swap="outerHTML">
        {% csrf_token %}
        <input type="hidden" name="extraction_id" value="{{ extraction_id }}">
        <div class="row g-2 align-items-end">
            <div class="col-md-5">
                <label class="form-label small">Domain Name</label>
                {{ rob_domain_form.domain_name }}
            </div>
            <div class="col-md-3">
                <label class="form-label small">Rating</label>
                {{ rob_domain_form.rating }}
            </div>
            <div class="col-md-3">
                <label class="form-label small">Notes</label>
                {{ rob_domain_form.notes }}
            </div>
            <div class="col-md-1">
                <button type="submit" class="btn btn-outline-primary w-100">
                    <i class="bi bi-plus"></i>
                </button>
            </div>
        </div>
    </form>

</div>
